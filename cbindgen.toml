# cbindgen configuration for the bixel-ffi crate.
# Regenerate with:
#   cbindgen --config cbindgen.toml --crate bixel-ffi --output generated/bixel.h

language = "C"
header = "/* Auto-generated by cbindgen. Do not edit. See crates/bixel-ffi/src/lib.rs. */"
include_guard = "BIXEL_H"
style = "Tag"

[parse]
parse_deps = false
clean = true
